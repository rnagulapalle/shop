[project]
name = "shop-backend"
version = "0.1.0"
description = "Shop API: GraphQL over FastAPI, Stripe payments, Resend emails"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "strawberry-graphql[fastapi]>=0.240",
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "stripe>=11.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
